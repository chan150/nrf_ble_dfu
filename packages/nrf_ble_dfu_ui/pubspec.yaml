name: nrf_ble_dfu_ui
description: Flutter UI widgets, SQLite database persistence, and SharedPreferences presets wrapper for the nrf_ble_dfu core.
version: 0.0.1
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.7.0'

dependencies:
  flutter:
    sdk: flutter
  nrf_ble_dfu:
    path: ../../
  # BLE through one Rust core (replaces flutter_blue_plus and its license).
  flutter_blue_rs: ^0.1.0
  # SmpManager, the Zephyr transport (kept apart so apps need not take sqflite).
  nrf_ble_dfu_smp:
    path: ../nrf_ble_dfu_smp
  # Nothing imports sqflite below. It is a platform implementation, registered
  # by being depended on rather than by being called: dropping it as unused
  # takes the history database off Android.
  file_picker: ^11.0.0
  path_provider:
  path:
  shared_preferences:
  intl:
  sqflite_common_ffi:

dev_dependencies:
  flutter_test:
    sdk: flutter
