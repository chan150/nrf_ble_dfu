name: nrf_ble_dfu_ui
description: Flutter UI widgets, SQLite database persistence, and SharedPreferences presets wrapper for the nrf_ble_dfu pure Dart core.
version: 0.0.1
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.7.0'

dependencies:
  flutter:
    sdk: flutter
  nrf_ble_dfu:
    path: ../../
  flutter_blue_plus: ^2.3.9
  flutter_blue_plus_winrt: 
  permission_handler:
  file_picker: 
  archive: 
  path_provider:
  path:
  shared_preferences:
  intl:
  sqflite:
  sqflite_common_ffi:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
