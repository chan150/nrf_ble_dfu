name: nrf_ble_dfu_ui
description: Flutter UI widgets, SQLite database persistence, and SharedPreferences presets wrapper for the nrf_ble_dfu core.
version: 0.0.1
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.7.0'

dependencies:
  flutter:
    sdk: flutter
  nrf_ble_dfu:
    path: ../../
  dfu_service_uuids:
    path: ../dfu_service_uuids
  flutter_blue_plus: ^2.3.9
  # Nothing imports flutter_blue_plus_winrt or sqflite below. Both are
  # platform implementations, registered by being depended on rather than by
  # being called: dropping them as unused takes Bluetooth off Windows and the
  # history database off Android.
  flutter_blue_plus_winrt: 
  file_picker: ^11.0.0
  path_provider:
  path:
  shared_preferences:
  intl:
  sqflite:
  sqflite_common_ffi:

dev_dependencies:
  flutter_test:
    sdk: flutter
